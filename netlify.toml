# Static HTML (not an SPA). Pretty URLs should serve /portfolio/index.html.
# Do not add a catch-all /* → /index.html rewrite.

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
